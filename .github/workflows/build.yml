name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and unsigned release build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
      - name: Reject lint errors
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          issues = ET.parse('app/build/reports/lint-results-debug.xml').getroot().findall('issue')
          errors = [i for i in issues if i.get('severity') in ('Error', 'Fatal')]
          assert not errors, [(i.get('id'), i.get('message')) for i in errors]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AndRip-unsigned-build-and-reports
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
      # Maintainers upload a verified, privately signed APK; see docs/RELEASING.md.
